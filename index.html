
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            font-family: Arial, sans-serif;
        }

        .calculator {
            width: 320px;
            padding: 20px;
            background: #171923;
            border-radius: 20px;
            box-shadow: 0 15px 40px #0005;
        }

        h2 {
            color: white;
            text-align: center;
            margin-top: 0;
        }

        #display {
            width: 100%;
            height: 75px;
            margin-bottom: 15px;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #2d3748;
            color: white;
            font-size: 30px;
            text-align: right;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 55px;
            border: none;
            border-radius: 12px;
            background: #374151;
            color: white;
            font-size: 20px;
            cursor: pointer;
            transition: 0.15s;
        }

        button:hover {
            filter: brightness(1.3);
        }

        button:active {
            transform: scale(0.95);
        }

        .operator {
            background: #4f46e5;
        }

        .clear {
            background: #e76f51;
        }

        .equals {
            background: #10b981;
        }

        .zero {
            grid-column: span 2;
        }
    </style>
</head>

<body>
    <div class="calculator">
        <h2>My Calculator</h2>

        <input id="display" value="0" readonly
               aria-label="Calculator display">

        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">AC</button>
            <button onclick="deleteLast()">DEL</button>
            <button onclick="percent()">%</button>
            <button class="operator" onclick="chooseOperator('/')">÷</button>

            <button onclick="appendNumber('7')">7</button>
            <button onclick="appendNumber('8')">8</button>
            <button onclick="appendNumber('9')">9</button>
            <button class="operator" onclick="chooseOperator('*')">×</button>

            <button onclick="appendNumber('4')">4</button>
            <button onclick="appendNumber('5')">5</button>
            <button onclick="appendNumber('6')">6</button>
            <button class="operator" onclick="chooseOperator('-')">−</button>

            <button onclick="appendNumber('1')">1</button>
            <button onclick="appendNumber('2')">2</button>
            <button onclick="appendNumber('3')">3</button>
            <button class="operator" onclick="chooseOperator('+')">+</button>

            <button onclick="toggleSign()">±</button>
            <button class="zero" onclick="appendNumber('0')">0</button>
            <button onclick="appendNumber('.')">.</button>
            <button class="equals" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        const display = document.getElementById("display");

        let current = "0";
        let previous = null;
        let operator = null;
        let startNew = false;

        function updateDisplay() {
            display.value = current;
        }

        function appendNumber(number) {
            if (startNew) {
                current = number === "." ? "0." : number;
                startNew = false;
            } else if (number === "." && current.includes(".")) {
                return;
            } else if (current === "0" && number !== ".") {
                current = number;
            } else {
                current += number;
            }

            updateDisplay();
        }

        function chooseOperator(op) {
            if (operator && !startNew) {
                calculate();
            }

            previous = Number(current);
            operator = op;
            startNew = true;
        }

        function calculate() {
            if (operator === null || previous === null) return;

            const a = previous;
            const b = Number(current);
            let result;

            switch (operator) {
                case "+": result = a + b; break;
                case "-": result = a - b; break;
                case "*": result = a * b; break;
                case "/":
                    if (b === 0) {
                        current = "Cannot divide by zero";
                        previous = null;
                        operator = null;
                        startNew = true;
                        updateDisplay();
                        return;
                    }
                    result = a / b;
                    break;
            }

            current = String(Number(result.toPrecision(12)));
            previous = null;
            operator = null;
            startNew = true;
            updateDisplay();
        }

        function clearDisplay() {
            current = "0";
            previous = null;
            operator = null;
            startNew = false;
            updateDisplay();
        }

        function deleteLast() {
            if (startNew || current === "Cannot divide by zero") {
                current = "0";
                startNew = false;
            } else {
                current = current.length > 1
                    ? current.slice(0, -1)
                    : "0";
            }
            updateDisplay();
        }

        function percent() {
            current = String(Number(current) / 100);
            updateDisplay();
        }

        function toggleSign() {
            if (current !== "0" &&
                current !== "Cannot divide by zero") {
                current = String(-Number(current));
                updateDisplay();
            }
        }
    </script>
</body>
</html>
